services:
  - type: web
    name: student-success-predictor-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://student-success-predictor.vercel.app"
      - key: ENVIRONMENT
        value: production
